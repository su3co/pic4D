name = "Racetrack ring sensor"
subtitle = "SOI 220 nm · 1550 nm"
gds = "s2-ring-sensor.gds"

[[layer]]
gds = [1, 0]
zmin = 0.0
zmax = 0.22
material = "si"
role = "core"

[cladding]
zmin = 0.0
zmax = 0.9
material = "water"

[light]
mode = "path"
wavelength_nm = 1550
source = [-7.474, -5.666]
coupling_gap_um = 0.3
weight = "weight.npz"
weight_gamma = 0.45
pulses = 3
caption = "Light paths drawn with the brightness of the simulated intensity |E|² on resonance; the travelling pulses are an illustration."

[camera]
move = "orbit"
azimuth = -60
elevation = 38
amplitude = 14

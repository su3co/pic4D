name = "Grating coupler"
subtitle = "SOI 220 nm, 70 nm etch · 1550 nm"
gds = "grating-coupler.gds"
frame = [-4.0, -6.0, 20.0, 6.0]

[[layer]]
gds = [2, 0]
zmin = 0.0
zmax = 0.15
material = "si"
role = "solid"
name = "slab"

[[layer]]
gds = [1, 0]
zmin = 0.0
zmax = 0.22
material = "si"
role = "core"
name = "grating"

[display]
widen_um = 0.0
z_scale = 2.0   # heights drawn 2 x, so the 1.7 um of beam above the chip reads
crop_to_frame = true   # a cut-out of the grating end of the 170 um long coupler

[substrate]
material = "box"

[light]
mode = "field"
field = "field.npz"
cycles = 6
percentile = 97.0
# the cross-section stands on the centre line of the cut chip: from 0.6 um into the oxide
# up to just under the fibre source plane, fading out at its top and sides
plane_z_um = [-0.6, 1.7]
plane_fade = [0.06, 0.3, 0.0]
caption = "Simulated field Re E_z at 1552.5 nm in the cross-section along the centre line (heights drawn 2 x): the fibre beam couples into the waveguide."

[camera]
move = "orbit"   # a flat chip seen from above at three-quarter view, the cut face towards the camera
azimuth = -58
elevation = 28
amplitude = 6
zoom = 1.1
target_um = [6.75, 2.6]   # the middle of the cut die

[style_overrides.white.light]
field_gamma = 0.5
field_opacity = 1.0

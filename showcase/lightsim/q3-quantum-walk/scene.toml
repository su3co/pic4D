name = "Quantum walk in 21 coupled waveguides"
subtitle = "SiOxNy in SiO2 · 804 nm"
gds = "q3-quantum-walk.gds"
# a cut-out of the 5 mm chip: the end of the fan-in and the 350 um of coupled array
# that were simulated in 3-D (the array continues to 700 um, the fans to the facets)
frame = [2821.0, -38.0, 3221.0, 38.0]

[[layer]]
gds = [1, 0]
zmin = 0.0
zmax = 0.566
material = "sin"   # drawn with the dielectric-core look of the renderer (SiOxNy)
role = "core"

[display]
widen_um = 0.6   # cores drawn 1.17 um wide instead of 0.57 um so that they read at this size
z_scale = 3.0    # heights drawn 3 x
crop_to_frame = true

[substrate]
material = "box"

[light]
mode = "intensity"
wavelength_nm = 804
weight = "weight.npz"
weight_gamma = 0.3
percentile = 98.0
offset_um = 0.566
beats = 3
plane_fade = [0.03, 0.0, 0.0]
caption = "Simulated intensity |E|² in the core plane of the 350 µm array at 804 nm, the central guide excited; its pulsing brightness is only an illustration."

[camera]
move = "orbit"
azimuth = -60
elevation = 32
amplitude = 8
zoom = 1.05
target_um = [3021.0, 0.0]

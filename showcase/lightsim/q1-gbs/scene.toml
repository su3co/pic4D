name = "Gaussian boson sampler"
subtitle = "SiN 800 nm · 1550 nm"
gds = "q1-gbs.gds"

[[layer]]
gds = [1, 0]
zmin = 0.0
zmax = 0.8
material = "sin"
role = "core"

[[layer]]
gds = [11, 0]
zmin = 2.0
zmax = 2.2
material = "heater"
role = "solid"

[cladding]
zmin = 0.0
zmax = 3.0
material = "sio2"

[light]
mode = "path"
wavelength_nm = 1550
# the four bus waveguides of the ring squeezers, lit at once
source = [[-110.987, -60.125], [-110.987, -20.215], [-110.987, 19.694], [-110.987, 59.934]]
coupling_gap_um = 0.5
pulses = 3
caption = "Illustration of the light paths (not a simulation): four ring squeezers feed the interferometer mesh."

[camera]
move = "orbit"
azimuth = -30
elevation = 32
amplitude = 12

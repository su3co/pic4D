name = "Type-II fusion circuit"
subtitle = "Si 220 nm · 1550 nm"
gds = "q2-fusion.gds"

[[layer]]
gds = [2, 0]
zmin = 0.0
zmax = 0.15
material = "si"
role = "solid"

[[layer]]
gds = [1, 0]
zmin = 0.0
zmax = 0.22
material = "si"
role = "core"

[cladding]
zmin = 0.0
zmax = 2.0
material = "sio2"

[light]
mode = "path"
wavelength_nm = 1550
source = [[-13.546, -15.121], [-13.546, -5.021], [-13.546, 4.912], [-13.546, 14.846]]
coupling_gap_um = 0.3
pulses = 2
caption = "Illustration of the light paths (not a simulation): two dual-rail qubits meet at a crossing and two 50:50 couplers."

[camera]
move = "orbit"
azimuth = -60
elevation = 36
amplitude = 12

name = "Waveguide-enhanced Raman chip"
subtitle = "SiN · 785 nm pump"
gds = "s1-raman.gds"

[[layer]]
gds = [1, 0]
zmin = 0.0
zmax = 0.4
material = "sin"
role = "core"

[[layer]]
gds = [2, 0]
zmin = 0.41
zmax = 2.0
material = "sio2"
role = "clad"
name = "top oxide"

[[layer]]
gds = [3, 0]
zmin = 0.41
zmax = 2.0
material = "water"
role = "clad"
name = "analyte window"

[light]
mode = "path"
wavelength_nm = 785
source = [-1296.107, 243.694]
coupling_gap_um = 0.4
pulses = 4
caption = "Illustration of the light paths (not a simulation): the pump runs through a 10 mm spiral under the analyte, then into the spectrometer."

[camera]
move = "orbit"
azimuth = -38
elevation = 34
amplitude = 8
